# =============================================================================
# SmartVenta — Módulo Clients
# Spec-Driven Development · OpenAPI 3.0
# =============================================================================
openapi: "3.0.3"

info:
  title: SmartVenta — Clients API
  version: "1.0.0"
  description: |
    Gestión de clientes y niveles de descuento por tenant.
    Cada cliente pertenece a un nivel de descuento (Discount) que determina
    el porcentaje aplicado en sus compras.

servers:
  - url: /api
    description: Base path de la API

# =============================================================================
# Seguridad global
# =============================================================================
security:
  - tokenAuth: []

# =============================================================================
# Paths
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # Discounts
  # ---------------------------------------------------------------------------
  /discount/:
    get:
      operationId: discount_list
      summary: Listar niveles de descuento
      description: Retorna todos los niveles de descuento del tenant, ordenados por porcentaje ascendente.
      tags: [Discounts]
      responses:
        "200":
          description: Lista de descuentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discount"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: discount_create
      summary: Crear nivel de descuento
      description: |
        Crea un nuevo nivel de descuento para el tenant del usuario autenticado.
        No puede haber dos descuentos con el mismo porcentaje en el mismo tenant.
      tags: [Discounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCreate"
      responses:
        "201":
          description: Descuento creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /discount/{id}/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"

    get:
      operationId: discount_read
      summary: Obtener descuento por ID
      tags: [Discounts]
      responses:
        "200":
          description: Detalle del descuento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: discount_update
      summary: Actualizar descuento
      tags: [Discounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCreate"
      responses:
        "200":
          description: Descuento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: discount_partial_update
      summary: Actualización parcial de descuento
      tags: [Discounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCreate"
      responses:
        "200":
          description: Descuento actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: discount_delete
      summary: Eliminar descuento
      description: |
        Elimina el nivel de descuento. Fallará si hay clientes asociados
        (protección por FK CASCADE — considerar validación).
      tags: [Discounts]
      responses:
        "204":
          description: Descuento eliminado
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # Clients
  # ---------------------------------------------------------------------------
  /client/:
    get:
      operationId: client_list
      summary: Listar clientes
      description: |
        Retorna los clientes del tenant. Soporta búsqueda por nombre o teléfono
        y cálculo de ventas totales por rango de fecha.
      tags: [Clients]
      parameters:
        - name: q
          in: query
          description: Búsqueda por nombre completo o número de teléfono (parcial)
          schema:
            type: string
          example: "Juan"
        - name: start_date
          in: query
          description: Fecha inicio para cálculo de total de ventas (YYYY-MM-DD). Default hoy.
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: end_date
          in: query
          description: Fecha fin para cálculo de total de ventas (YYYY-MM-DD). Default hoy.
          schema:
            type: string
            format: date
          example: "2026-08-25"
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: client_create
      summary: Crear cliente
      description: Registra un nuevo cliente asociado a un nivel de descuento existente.
      tags: [Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /client/{id}/:
    parameters:
      - $ref: "#/components/parameters/ResourceId"

    get:
      operationId: client_read
      summary: Obtener cliente por ID
      tags: [Clients]
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Detalle del cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: client_update
      summary: Actualizar cliente
      tags: [Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: client_partial_update
      summary: Actualización parcial de cliente
      tags: [Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: client_delete
      summary: Eliminar cliente
      tags: [Clients]
      responses:
        "204":
          description: Cliente eliminado
        "404":
          $ref: "#/components/responses/NotFound"

# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Token de autenticación. Formato: `Token <valor>`"

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: ID del recurso
      schema:
        type: integer
        minimum: 1

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Discount ---
    Discount:
      type: object
      description: Nivel de descuento del tenant
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        discount_percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Porcentaje de descuento (0-100)
          example: 15
        discount_percentage_complement:
          type: integer
          readOnly: true
          description: "Complemento: 100 - discount_percentage. Útil para calcular precio final."
          example: 85
      required:
        - id
        - discount_percentage
        - discount_percentage_complement

    DiscountCreate:
      type: object
      description: Payload para crear/actualizar un descuento
      properties:
        discount_percentage:
          type: integer
          minimum: 0
          maximum: 100
          example: 10
      required:
        - discount_percentage

    # --- Client ---
    Client:
      type: object
      description: Cliente registrado en el sistema
      properties:
        id:
          type: integer
          readOnly: true
          example: 42
        first_name:
          type: string
          maxLength: 20
          example: "María"
        last_name:
          type: string
          maxLength: 20
          example: "González"
        phone_number:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^[0-9]{10}$"
          description: Número telefónico a 10 dígitos
          example: "5512345678"
        discount:
          type: integer
          description: ID del nivel de descuento asociado
          example: 1
        full_name:
          type: string
          readOnly: true
          description: "Nombre completo concatenado (first_name + last_name)"
          example: "María González"
        discount_percentage:
          type: integer
          readOnly: true
          description: Porcentaje de descuento heredado del Discount asociado
          example: 15
        discount_percentage_complement:
          type: integer
          readOnly: true
          description: Complemento del descuento (100 - porcentaje)
          example: 85
        total_sales_amount:
          type: number
          format: decimal
          readOnly: true
          description: Monto total de ventas del cliente en el rango de fechas solicitado
          example: 4500.00
      required:
        - id
        - first_name
        - last_name
        - phone_number
        - discount
        - full_name
        - discount_percentage
        - discount_percentage_complement
        - total_sales_amount

    ClientCreate:
      type: object
      description: Payload para crear/actualizar un cliente
      properties:
        first_name:
          type: string
          maxLength: 20
          example: "María"
        last_name:
          type: string
          maxLength: 20
          example: "González"
        phone_number:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^[0-9]{10}$"
          example: "5512345678"
        discount:
          type: integer
          description: ID del Discount a asociar
          example: 1
      required:
        - first_name
        - last_name
        - phone_number
        - discount

    # --- Errors ---
    ValidationErrorResponse:
      type: object
      description: Errores de validación
      additionalProperties:
        type: array
        items:
          type: string
      example:
        discount_percentage: ["discount with this discount percentage already exists."]
        phone_number: ["Ensure this field has at least 10 characters."]

  # ---------------------------------------------------------------------------
  # Responses reutilizables
  # ---------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Authentication credentials were not provided."

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Not found."

    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
