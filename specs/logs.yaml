# =============================================================================
# SmartVenta — Módulo Logs
# Spec-Driven Development · OpenAPI 3.0
# =============================================================================
openapi: "3.0.3"

info:
  title: SmartVenta — Logs API
  version: "1.0.0"
  description: |
    Bitácora de movimientos de inventario y cambios de precios.
    Registra cada operación con usuario, fecha, stock anterior/posterior
    y tipo de movimiento.

servers:
  - url: /api
    description: Base path de la API

# =============================================================================
# Seguridad global
# =============================================================================
security:
  - tokenAuth: []

# =============================================================================
# Paths
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # StoreProductLog ViewSet (CRUD)
  # ---------------------------------------------------------------------------
  /store-product-log/:
    get:
      operationId: store_product_log_list
      summary: Listar todos los logs de inventario
      tags: [Inventory Logs]
      responses:
        "200":
          description: Lista de logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreProductLog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /store-product-log/{id}/:
    get:
      operationId: store_product_log_retrieve
      summary: Detalle de un log
      tags: [Inventory Logs]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Detalle del log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProductLog"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # StoreProductLogs (búsqueda avanzada)
  # ---------------------------------------------------------------------------
  /store-product-logs/:
    get:
      operationId: store_product_logs_search
      summary: Buscar logs de inventario por sucursal
      description: |
        Dos modos de uso:
        - **Por StoreProduct ID**: retorna logs de un producto específico (últimos N meses).
        - **Por tienda**: retorna todos los logs de la sucursal activa con filtros opcionales.
      tags: [Inventory Logs]
      parameters:
        - $ref: "#/components/parameters/StoreIdHeader"
        - name: store-product-id
          in: query
          description: ID del StoreProduct. Si se envía, filtra solo este producto.
          schema:
            type: integer
        - name: months
          in: query
          description: Cantidad de meses hacia atrás (solo con store-product-id). Default 1.
          schema:
            type: integer
            default: 1
        - name: date
          in: query
          description: Filtrar por fecha exacta (YYYY-MM-DD). Solo sin store-product-id.
          schema:
            type: string
            format: date
        - name: brand_id
          in: query
          description: Filtrar por marca del producto
          schema:
            type: integer
        - name: action
          in: query
          description: Filtrar por tipo de acción
          schema:
            type: string
            enum: ["E", "S", "A", "N"]
        - name: store_related
          in: query
          description: Filtrar por tienda relacionada (origen/destino en traspasos)
          schema:
            type: integer
      responses:
        "200":
          description: Lista de logs
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/StoreProductLog"
                    - $ref: "#/components/schemas/StoreProductLogWithProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Choices
  # ---------------------------------------------------------------------------
  /store-product-logs/choices/:
    get:
      operationId: store_product_logs_choices
      summary: Obtener tipos de acción de log
      description: Retorna las opciones de LogAction para filtros en el frontend.
      tags: [Inventory Logs]
      responses:
        "200":
          description: Choices de acción
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      enum: ["E", "S", "A", "N"]
                    label:
                      type: string
                      enum: ["Entrada", "Salida", "Ajuste", "NA"]

  # ---------------------------------------------------------------------------
  # Product Price Logs
  # ---------------------------------------------------------------------------
  /product-price-logs/:
    get:
      operationId: product_price_logs
      summary: Historial de cambios de precios
      description: |
        Retorna el historial de cambios en cost, unit_price, wholesale_price
        y min_wholesale_quantity.
        - Si se envía `product_id`, filtra por ese producto.
        - Si no, filtra por los últimos N meses (default 1).
      tags: [Price Logs]
      parameters:
        - name: product_id
          in: query
          description: ID del producto. Si se envía, retorna todos sus logs.
          schema:
            type: integer
        - name: months
          in: query
          description: Meses hacia atrás (solo sin product_id). Default 1.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Lista de logs de precios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductPriceLog"
        "401":
          $ref: "#/components/responses/Unauthorized"

# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Token authentication. Formato: `Token <tu-token>`"

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    StoreIdHeader:
      name: store-id
      in: header
      required: true
      description: ID de la sucursal activa
      schema:
        type: integer

    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    StoreProductLog:
      type: object
      properties:
        id:
          type: integer
        store_product:
          type: integer
        store_related:
          type: integer
          nullable: true
          description: Tienda origen/destino en traspasos/distribuciones
        user:
          type: integer
        user_username:
          type: string
        previous_stock:
          type: integer
        updated_stock:
          type: integer
        action:
          type: string
          enum: ["E", "S", "A", "N"]
          description: |
            E = Entrada
            S = Salida
            A = Ajuste
            N = NA
        movement:
          type: string
          enum: ["MA", "IM", "DI", "TR", "DE", "VE", "AP", "CO"]
          description: |
            MA = Manual
            IM = Importación
            DI = Distribución
            TR = Transferencia
            DE = Devolución
            VE = Venta
            AP = Apartado
            CO = Conversión
        description:
          type: string
          description: Texto legible combinando acción + movimiento + tienda relacionada
          example: "Salida Transferencia Destino: Centro (Tienda)"
        difference:
          type: string
          description: "Diferencia de stock con signo (ej: +5, -3)"
          example: "+5"
        is_consistent:
          type: boolean
          description: |
            True si el previous_stock coincide con el updated_stock del log anterior.
            False indica una inconsistencia en la bitácora.
        created_at:
          type: string
          format: date-time

    StoreProductLogWithProduct:
      allOf:
        - $ref: "#/components/schemas/StoreProductLog"
        - type: object
          properties:
            product:
              $ref: "#/components/schemas/ProductDetail"
              description: Datos del producto (usado en búsqueda por tienda)

    ProductDetail:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        cost:
          type: string
          format: decimal
        unit_price:
          type: string
          format: decimal
        wholesale_price:
          type: string
          format: decimal
          nullable: true
        min_wholesale_quantity:
          type: integer
          nullable: true
        wholesale_price_on_client_discount:
          type: boolean
        image:
          type: string
          format: uri
          nullable: true
        brand:
          type: integer
        brand_name:
          type: string
        department:
          type: integer
          nullable: true
        department_name:
          type: string
        apply_wholesale:
          type: boolean
        stock:
          type: integer

    ProductPriceLog:
      type: object
      properties:
        id:
          type: integer
        product:
          type: integer
        product_code:
          type: string
        product_name:
          type: string
        brand_name:
          type: string
        user_username:
          type: string
        field:
          type: string
          enum: ["cost", "unit_price", "wholesale_price", "min_wholesale_quantity"]
        field_display:
          type: string
          enum: ["Costo", "Precio menudeo", "Precio mayoreo", "Cantidad mínima mayoreo"]
        previous_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Token inválido o no proporcionado
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Authentication credentials were not provided."

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Not found."
