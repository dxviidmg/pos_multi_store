# =============================================================================
# SmartVenta — Módulo Printers
# Spec-Driven Development · OpenAPI 3.0
# =============================================================================
openapi: "3.0.3"

info:
  title: SmartVenta — Printers API
  version: "1.0.0"
  description: |
    Configuración de impresoras térmicas por sucursal.
    Cada tienda puede tener una impresora asignada para impresión de tickets.

servers:
  - url: /api
    description: Base path de la API

# =============================================================================
# Seguridad global
# =============================================================================
security:
  - tokenAuth: []

# =============================================================================
# Paths
# =============================================================================
paths:
  /store-printer/:
    get:
      operationId: store_printer_list
      summary: Listar impresoras asignadas a tiendas
      description: Retorna todas las impresoras configuradas en las tiendas del tenant.
      tags: [Printers]
      responses:
        "200":
          description: Lista de impresoras por tienda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorePrinter"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: store_printer_create
      summary: Asignar impresora a una tienda
      tags: [Printers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store, printer]
              properties:
                store:
                  type: integer
                  description: ID de la tienda
                printer:
                  type: integer
                  description: ID de la impresora
      responses:
        "201":
          description: Impresora asignada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePrinter"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /store-printer/{id}/:
    get:
      operationId: store_printer_retrieve
      summary: Detalle de una asignación impresora-tienda
      tags: [Printers]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Detalle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePrinter"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: store_printer_update
      summary: Actualizar asignación impresora-tienda
      tags: [Printers]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store:
                  type: integer
                printer:
                  type: integer
      responses:
        "200":
          description: Asignación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePrinter"

    delete:
      operationId: store_printer_delete
      summary: Eliminar asignación impresora-tienda
      tags: [Printers]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Eliminada

# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Token authentication. Formato: `Token <tu-token>`"

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    StorePrinter:
      type: object
      properties:
        id:
          type: integer
        store:
          $ref: "#/components/schemas/Store"
        printer:
          $ref: "#/components/schemas/Printer"

    Store:
      type: object
      description: Detalle de la tienda (serialización completa)
      properties:
        id:
          type: integer
        name:
          type: string
        store_type:
          type: string
          enum: ["T", "A"]
        store_type_display:
          type: string
        full_name:
          type: string
          example: "Centro (Tienda)"
        tenant:
          type: integer
        tenant_name:
          type: string
        manager:
          type: integer
        manager_username:
          type: string
        address:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        workers_count:
          type: integer
        products_count:
          type: integer
        printer:
          oneOf:
            - type: integer
            - type: boolean
          description: ID de la impresora asignada o false
        pending_transfers_count:
          type: integer

    Printer:
      type: object
      properties:
        id:
          type: integer
        brand:
          type: integer
          description: ID de la marca de impresora
        model:
          type: string
          example: "TM-T20II"
        font_height:
          type: integer
          default: 20
          description: Altura de fuente en píxeles para impresión

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Token inválido o no proporcionado
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Authentication credentials were not provided."

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Not found."
